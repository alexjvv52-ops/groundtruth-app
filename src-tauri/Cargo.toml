[package]
name = "prairie-roots-farm-os"
default-run = "prairie-roots-farm-os"
version = "0.1.0"
description = "Local-first desktop app for microgreens growers. One SQLite file, no account, no cloud."
authors = ["alexjvv52-ops"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prairie_roots_farm_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "verify_replay"
path = "src/bin/verify_replay.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3.3.0", features = ["json"] }
base64 = "0.23.1"
sha2 = "0.10"
qrcode = { version = "0.14.1", default-features = false }

# KEY-AT-REST (WRAP A): DPAPI for the two connection secrets. Already in the
# lock as a transitive crate; only these two features are new.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

